name = "uptimeflare"
main = "src/worker/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# Serve the React SPA via Cloudflare Workers Static Assets (Free & unlimited static requests)
# run_worker_first ensures all /api/* routes always invoke the Worker script first
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 1-minute Cron Trigger to execute scheduled uptime checks & D1 retention pruning
[triggers]
crons = ["* * * * *"]

# Cloudflare D1 Database Binding (Free Plan: 5 GB storage, 5M rows read/day, 100k rows written/day)
# Omitting database_id allows Wrangler v4 / Workers Builds to automatically provision the database on first deploy,
# or you can bind any D1 database named `DB` in the Cloudflare Dashboard (Settings -> Bindings).
[[d1_databases]]
binding = "DB"
database_name = "uptimeflare-db"
migrations_dir = "migrations"
